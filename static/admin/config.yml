backend:
  name: github
  repo: edwardsmoses/edwardsmoses.com
  accept_roles:
    - admin
    - editor
  branch: main

media_folder: static/assets
public_folder: /assets

collections:
  - name: settings
    label: Settings
    files:
      - name: config
        label: Config
        file: site-meta-data.json
        fields:
          - widget: string
            name: title
            label: Site Title
            required: true
          - widget: string
            name: shortTitle
            label: Short Site Title
            required: true
          - widget: string
            name: author
            label: Author
            required: true
          - widget: string
            name: siteUrl
            label: Website URL
            required: true
          - widget: text
            name: description
            label: Description
            default: ""
            required: false
          - widget: image
            name: image
            label: Default Social Image
            required: true
          - widget: string
            name: twitterUsername
            label: Twitter Username
            required: true
          - widget: string
            name: jobTitle
            label: Job Title
            required: true
          - widget: string
            name: location
            label: Location
            required: true
          - widget: list
            name: sameAs
            label: Profile URLs
            required: true
          - widget: list
            name: knowsAbout
            label: Areas of Expertise
            required: true
          - widget: object
            name: home
            label: Homepage Options
            fields:
              - widget: string
                name: title
                label: Title
                default: ""
                required: false
              - widget: markdown
                name: description
                label: Description
                default: ""
                required: false
  - name: blog
    label: Blog
    folder: _data/blog
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    fields:
      - { label: Template, name: template, widget: hidden, default: BlogPost }
      - name: path
        label: Path
        widget: string
        pattern: [/, "Must start with /"]
        hint: "Path must start with /"
      - { name: date, label: Date, widget: datetime }
      - name: updated
        label: Last Updated
        widget: datetime
        required: false
      - { name: title, label: Title }
      - label: Meta Description
        name: metaDescription
        widget: text
        required: false
      - label: Featured Image
        name: thumbnail
        widget: image
        hint: "Image size 1280x800 works best :)"
        required: false
        media_library:
          config:
            multiple: false
      - { name: body, label: Body, widget: markdown }
